name: pre-commit

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install project and Python tools
        run: |
          python -m pip install -e ".[dev]"


      - uses: pre-commit/action@v3.0.1
