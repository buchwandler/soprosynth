[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soprosynth"
dynamic = ["version"]
description = "Sopro TTS API with OnnxVoice graph embedding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.23", "onnxvoice>=0.2.4,<0.4"]
keywords = ["sopro", "tts", "onnx", "onnxvoice"]

[project.optional-dependencies]
# Native backend provides a working TTS path until the multi-graph ONNX loop is implemented.
native = ["sopro>=2.2.0,<3"]
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.8", "setuptools_scm>=8"]

[project.scripts]
soprosynth = "soprosynth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soprosynth*"]
[tool.setuptools.package-data]
soprosynth = ["py.typed"]
[tool.setuptools_scm]
write_to = "soprosynth/_version.py"
fallback_version = "0.0.0"
local_scheme = "no-local-version"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
line-length = 100
