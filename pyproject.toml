[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soprosynth"
dynamic = ["version"]
description = "Stable Python API for ONNXVoice's Sopro V2 Turbo runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.23", "audiosig>=0.1.8,<0.2"]
keywords = ["sopro", "tts", "onnx", "onnxvoice"]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu]>=0.2.6,<0.3"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.8", "setuptools_scm>=8", "twine>=5"]

[project.scripts]
soprosynth = "soprosynth.__main__:main"
soprosynth-build-calibration = "soprosynth.calibration_builder:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soprosynth*"]
[tool.setuptools.package-data]
soprosynth = ["py.typed", "data/*.json"]
[tool.setuptools_scm]
write_to = "soprosynth/_version.py"
fallback_version = "0.0.0"
local_scheme = "no-local-version"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py310"
line-length = 100
